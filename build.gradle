plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
    archivesName = 'mobtrader'
}

dependencies {
    minecraft group: 'com.mojang', name: 'minecraft', version: project.minecraft_version
    implementation group: 'net.fabricmc', name: 'fabric-loader', version: project.loader_version
    implementation group: 'net.fabricmc.fabric-api', name: 'fabric-api', version: project.fabric_api_version
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
